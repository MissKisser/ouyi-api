# docker-compose.dev.yml — local development with hot reload.
#
# Usage:
#   cp .env.example .env
#   cp config.example.toml config/config.toml
#   docker compose -f docker-compose.dev.yml up
#
# What it does:
#   * ouyi-api:    runs `cargo run` with the source bind-mounted in, so edits
#                  to *.rs files trigger restart via the `cargo` target dir
#                  cache. Rust compilation is slow even so — a real hot
#                  reload would need something like `cargo watch`, which we
#                  intentionally do NOT install in the image; rerun
#                  `docker compose restart ouyi-api` after edits.
#   * web:         vite dev server with HMR; proxies /api, /v1, /anthropic
#                  to the backend container (see web/vite.config.ts).
#
# Bind mounts are read-write so Cargo can write to /app/target inside the
# container. Persist the target directory on the host to avoid re-downloading
# dependencies on each `up`.

services:
  ouyi-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: ouyi-api:dev
    container_name: ouyi-api-dev
    env_file:
      - .env
    environment:
      RUST_LOG: ${RUST_LOG:-info,ouyi_api=debug}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: ${SERVER_PORT:-3000}
      OUYI_CONFIG: /app/config/config.toml
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    ports:
      - "${SERVER_BIND:-127.0.0.1}:${SERVER_PORT:-3000}:${SERVER_PORT:-3000}"
    volumes:
      - ./:/app:rw
      - ./config:/app/config:rw
      # Persist Cargo target/registry to a named volume so we don't re-fetch
      # the world on every `docker compose up`.
      - cargo-target-dev:/app/target
      - cargo-registry-dev:/usr/local/cargo/registry
      - cargo-git-dev:/usr/local/cargo/git
    working_dir: /app
    command:
      - bash
      - -c
      - >
        cargo run --locked
    tty: true
    stdin_open: true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO-
          "http://127.0.0.1:${SERVER_PORT:-3000}/v1/models" >/dev/null
          || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  web:
    image: node:22-bookworm-slim
    container_name: ouyi-web-dev
    working_dir: /web
    env_file:
      - .env
    environment:
      # vite picks VITE_* at build time. The proxy target is the backend.
      VITE_API_PROXY_TARGET: http://ouyi-api-dev:${SERVER_PORT:-3000}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-5173}:5173"
    volumes:
      - ./web:/web:rw
      - web-node-modules:/web/node_modules
    command:
      - bash
      - -c
      - >
        npm ci --no-audit --no-fund &&
        npm run dev -- --host 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  cargo-target-dev:
  cargo-registry-dev:
  cargo-git-dev:
  web-node-modules:
