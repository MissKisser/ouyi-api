# docker-compose.yml — production-style single-host deployment.
#
# Usage:
#   1. Copy `.env.example` to `.env` and fill in real values.
#   2. Make sure `${OUYI_CONFIG_DIR}` contains a real config.toml (NEVER commit secrets).
#      Production default: /var/lib/ouyi-api/config.
#   3. `docker compose up -d --build`
#   4. Tail logs: `docker compose logs -f ouyi-api`
#
# This file intentionally does not include a reverse proxy. Run nginx / caddy
# on the host (or another container) and point it at ${SERVER_PORT}.
#
# IMPORTANT:
#   * host.bind should be a single, non-default port the user has explicitly
#     chosen. 127.0.0.1 is the safe default; switch to "0.0.0.0" or a specific
#     host IP only if a reverse proxy is NOT going to front this container.
#   * OUYI_CONFIG_DIR must contain config.toml. The container writes back into
#     OUYI_CONFIG when JWT self-repair runs (interactive prompt is skipped
#     because stdin is not a TTY here — that's intentional for unattended ops).

services:
  ouyi-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ouyi-api:latest
    container_name: ouyi-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Compose env takes precedence over .env for the things we want to
      # fix here, since this file is checked in.
      RUST_LOG: ${RUST_LOG:-info}
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      SERVER_PORT: ${SERVER_PORT:-3000}
      OUYI_CONFIG: /app/config/config.toml
    ports:
      # Single, uncommonly-used port bound to loopback. Override in .env if a
      # reverse proxy on the host needs to reach this container via a
      # different interface.
      - "${SERVER_BIND:-127.0.0.1}:${SERVER_PORT:-3000}:${SERVER_PORT:-3000}"
    volumes:
      # Keep mutable configuration outside the release checkout so container
      # recreation, image rebuilds, deployments and rollbacks cannot replace it.
      - ${OUYI_CONFIG_DIR:-/var/lib/ouyi-api/config}:/app/config:rw
    # Healthcheck defined in the Dockerfile — same probe logic.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO-
          "http://127.0.0.1:${SERVER_PORT:-3000}/v1/models" >/dev/null
          || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Drop Linux capabilities beyond the minimum; no new privileges for the
    # binary. ouyi-api does not need raw socket / NET_ADMIN.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # Container-imposed resource caps. Tune in `.env` if needed.
    mem_limit: ${MEM_LIMIT:-1g}
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
